<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>津波防災調査アプリ</title>
<meta name="description" content="地上部調査・概況調査・植生調査を現地で記録し、Excelに出力するアプリ（オフライン対応）">
<meta name="theme-color" content="#1f5c3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="津波防災調査">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css'">
<style>
/* ===== デザイントークン（樹木点検アプリと共通の緑） ===== */
:root {
  --green-900: #143d27; --green-800: #1f5c3a; --green-600: #2f8052; --green-100: #e3f2e7; --green-50: #f2f8f3;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f5f2; --fg: #17241b; --muted: #66756a; --line: #dfe6df;
  --accent: var(--green-800); --accent-fg: #ffffff; --danger: #c43d3d; --warn: #b26a00;
  --k-chijo: #1f6b43; --k-gaikyo: #8a5a1f; --k-veg: #5b3a8c;
  --shadow-1: 0 1px 2px rgba(16,40,24,.10), 0 2px 8px rgba(16,40,24,.10);
  --shadow-2: 0 6px 24px rgba(16,40,24,.18), 0 1px 3px rgba(16,40,24,.12);
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: 62px;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  -webkit-text-size-adjust: 100%;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101712; --surface: #172019; --surface-2: #212c24; --fg: #e8efe9; --muted: #9fb0a4; --line: #2c3a30;
    --accent: #6cc28a; --accent-fg: #0d1f14; --green-100: #22382a; --green-50: #1a271e;
    --k-chijo: #6cc28a; --k-gaikyo: #e0a65a; --k-veg: #b79be0;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35); --shadow-2: 0 6px 24px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); overscroll-behavior: none; }
body { font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
#map { position: fixed; inset: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== 上部 ===== */
.topbar { position: fixed; z-index: 10; top: calc(var(--safe-t) + 10px); left: 10px; right: 58px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.searchbar { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow-2); padding: 4px 4px 4px 12px; max-width: 520px; }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 4px; outline: none; font-size: 15px; }
.icon-btn { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--fg); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.headchips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 520px; }
.headchips button { border: 0; border-radius: 999px; padding: 5px 11px; background: var(--surface); box-shadow: var(--shadow-1); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.headchips button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.headchips .prog { background: var(--green-800); color: #fff; }
.offpill { position: fixed; z-index: 10; top: calc(var(--safe-t) + 104px); left: 10px; background: #5d4037; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.offpill svg.ic { width: 15px; height: 15px; }
.legend { position: fixed; z-index: 5; left: 10px; bottom: calc(var(--nav-h) + var(--safe-b) + 34px); background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: 6px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1.5px solid rgba(0,0,0,.35); }
.legend i.sq { border-radius: 2px; }

/* ===== 右側のボタン ===== */
.fabs { position: fixed; z-index: 10; right: 10px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); display: flex; flex-direction: column; gap: 10px; }
.fab { width: 50px; height: 50px; border-radius: 16px; border: 0; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-2); display: grid; place-items: center; position: relative; }
.fab small { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 9px; font-weight: 700; line-height: 1; }
.fab.add { background: var(--k-chijo); color: #fff; }
.fab.veg { background: var(--k-veg); color: #fff; }
.fab.active { color: #1a73e8; }
.fab.busy { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.maplibregl-ctrl-top-right { top: calc(var(--safe-t) + 4px); }
.maplibregl-ctrl-top-right .maplibregl-ctrl-geolocate { display: none; }
.maplibregl-ctrl-bottom-left { bottom: calc(var(--nav-h) + var(--safe-b)); }
.maplibregl-ctrl-bottom-right { bottom: calc(var(--nav-h) + var(--safe-b)); }

/* ===== 下部メニュー ===== */
.bottomnav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
.bottomnav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.bottomnav button.on { color: var(--fg); }
.bottomnav button.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--kc, var(--accent)); }
.bottomnav button[data-pane="chijo"] { --kc: var(--k-chijo); }
.bottomnav button[data-pane="gaikyo"] { --kc: var(--k-gaikyo); }
.bottomnav button[data-pane="veg"] { --kc: var(--k-veg); }

/* ===== シート ===== */
.sheet { position: fixed; z-index: 15; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); height: 62vh; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-2); display: flex; flex-direction: column; transition: height .22s ease; }
.sheet.full { height: calc(100vh - var(--nav-h) - var(--safe-b) - var(--safe-t) - 12px); height: calc(100dvh - var(--nav-h) - var(--safe-b) - var(--safe-t) - 12px); }
.sheet.mini { height: 64px; }
.sheet.mini .sheet-body { visibility: hidden; }
.sheet-head { display: flex; align-items: center; gap: 2px; padding: 8px 6px 6px 16px; border-bottom: 1px solid var(--line); border-top: 4px solid var(--kc, transparent); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.sheet-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { flex: 1; overflow: auto; padding: 12px 14px 24px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet[data-k="chijo"] { --kc: var(--k-chijo); }
.sheet[data-k="gaikyo"] { --kc: var(--k-gaikyo); }
.sheet[data-k="veg"] { --kc: var(--k-veg); }
@media (min-width: 900px) {
  .sheet, .sheet.full { left: 10px; right: auto; width: 440px; top: calc(var(--safe-t) + 112px); bottom: calc(var(--nav-h) + var(--safe-b) + 10px); height: auto; border-radius: var(--r-lg); }
  .sheet.mini { height: 64px; top: auto; }
  .bottomnav { left: 10px; right: auto; width: 440px; bottom: 10px; border-radius: var(--r-lg); border: 0; box-shadow: var(--shadow-2); height: var(--nav-h); padding: 0; }
  .sheet { bottom: calc(var(--nav-h) + 20px); }
  .maplibregl-ctrl-bottom-left { left: 460px; bottom: 0; }
  .legend { left: 460px; bottom: 34px; }
}

/* ===== フォーム ===== */
.sec { margin: 18px 0 8px; font-size: 13px; font-weight: 700; color: var(--kc, var(--accent)); display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec:first-child { margin-top: 2px; }
.field { display: block; margin: 0 0 12px; }
.lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.lbl .req { color: var(--danger); margin-left: 3px; }
.infobtn { border: 0; background: transparent; color: var(--kc, var(--accent)); width: 30px; height: 26px; margin: -4px 0 -4px 2px; padding: 0; display: inline-grid; place-items: center; vertical-align: middle; border-radius: 50%; }
.infobtn svg.ic { width: 19px; height: 19px; }
.infobtn.on { background: var(--green-50); }
.infopop { background: var(--surface-2); border-left: 3px solid var(--kc, var(--accent)); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 8px 10px; margin: 0 0 8px; font-size: 12.5px; line-height: 1.5; }
.infopop p { margin: 4px 0; }
.scaledesc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.scaledesc li { display: flex; gap: 8px; }
.scaledesc b { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 12px; }
/* 調査区：インデックスタブ */
.ztabs { position: sticky; top: -12px; z-index: 2; display: flex; gap: 3px; align-items: flex-end; margin: 4px -14px 0; padding: 8px 10px 0; background: var(--surface); border-bottom: 3px solid var(--kc); box-shadow: 0 8px 10px -8px rgba(0,0,0,.25); overflow-x: auto; scrollbar-width: none; }
.ztabs button { flex: 1 1 0; min-width: 62px; border: 1px solid var(--line); border-bottom: 0; background: var(--surface-2); color: var(--muted); border-radius: 10px 10px 0 0; padding: 8px 6px 7px; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ztabs button.on { background: var(--kc); border-color: var(--kc); color: #fff; padding-top: 11px; }
.ztabs button[data-z="note"] { flex: 0 0 auto; min-width: 54px; }
.ztitle { font-weight: 700; font-size: 15px; color: var(--kc); margin: 10px 0 8px; padding-left: 8px; border-left: 4px solid var(--kc); }
.sheet[data-k="gaikyo"] .sheet-body { scroll-padding-top: 96px; }
.help { font-size: 11.5px; color: var(--muted); margin: 4px 0 0; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 11px; font-size: 16px; outline: none; }
.inp:focus { border-color: var(--kc, var(--accent)); }
textarea.inp { min-height: 76px; resize: vertical; }
.unitbox { position: relative; }
.unitbox .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.unitbox .inp { padding-right: 40px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 8px; }
.halfrow .field { min-width: 0; }
.halfrow .seg button { flex: 1; padding: 7px 6px; }
.dom { display: block; padding: 8px 6px; font-size: 13.5px; background: var(--surface-2); border-radius: var(--r-sm); min-height: 38px; color: var(--fg); overflow-wrap: anywhere; }
.dom:empty::before { content: "（自動）"; color: var(--muted); }
.bbguide { margin-top: 8px; }
.bbguide summary { font-weight: 700; color: var(--k-veg); cursor: pointer; padding: 6px 0; }
.bbguide h4 { margin: 12px 0 6px; font-size: 13px; }
.bbrow { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.bbrow svg { flex: none; width: 76px; height: 76px; }
.bbrow b { font-size: 14px; color: var(--k-veg); }
.bbrow .bbs { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; background: var(--surface-2); border-radius: 999px; padding: 0 8px; }
.bbrow p { margin: 0; font-size: 12.5px; line-height: 1.5; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 6px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0 5px; }
.grid4 .inp, .grid5 .inp { padding: 9px 6px; text-align: center; }
.grid4 .lbl, .grid5 .lbl { text-align: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; min-height: 38px; }
.seg button.on { background: var(--kc, var(--accent)); border-color: var(--kc, var(--accent)); color: #fff; font-weight: 600; }
.seg.sq button { border-radius: var(--r-sm); min-width: 46px; }
.scale { display: grid; gap: 5px; }
.scale button { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 7px 10px; font-size: 13px; line-height: 1.4; }
.scale button b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 13px; }
.scale button.on { border-color: var(--kc, var(--accent)); background: var(--green-50); box-shadow: inset 0 0 0 1px var(--kc, var(--accent)); }
.scale button.on b { background: var(--kc, var(--accent)); color: #fff; }
.scale.compact button span { display: none; }
.scale.compact button b { width: 30px; height: 30px; font-size: 15px; }
.scale.compact { grid-template-columns: repeat(5, 1fr); }
.scale.compact button { justify-content: center; }
.btn { border: 0; border-radius: var(--r-md); padding: 11px 14px; font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface-2); color: var(--fg); min-height: 44px; }
.btn.main { background: var(--kc, var(--accent)); color: #fff; }
.btn.line { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
.btn.block { width: 100%; }
.btn.mini { min-height: 34px; padding: 6px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btnrow .btn.mini { flex: 1 1 auto; }
.sticky-foot .btn.danger { flex: 0 0 52px; padding: 0; }
.btn:disabled { opacity: .45; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.sticky-foot { position: sticky; bottom: -24px; background: var(--surface); padding: 10px 0 12px; margin-top: 16px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
.sticky-foot .btn { flex: 1; }
.infobox { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.infobox dt { color: var(--muted); }
.infobox dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.notebox { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; font-size: 12.5px; color: var(--muted); margin: 10px 0; }
.notebox b { color: var(--fg); }
.badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.done { background: #2e7d32; color: #fff; }
.badge.draft { background: #fff3cd; color: #7a5a00; }
.badge.bad { background: #fde3e3; color: #a12a2a; }
.badge.good { background: #e3f2e7; color: #1f5c3a; }
.calc { background: var(--green-50); border: 1px dashed var(--kc, var(--accent)); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.calc b { font-size: 17px; }

/* ===== 一覧 ===== */
.tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--line); }
.list li > button { width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 2px; display: flex; align-items: center; gap: 10px; }
.list .dotc { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1.5px solid rgba(0,0,0,.3); }
.list .main { flex: 1; min-width: 0; }
.list .chk { width: 22px; height: 22px; flex: none; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; }
.list .chk.on { background: var(--danger); border-color: var(--danger); color: #fff; }
.list .chk svg.ic { width: 16px; height: 16px; stroke-width: 3; }
.list .t1, .list .t2 { display: block; }
.list .t1 { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .t2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.empty .btn { margin-top: 12px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat div { background: var(--surface-2); border-radius: var(--r-md); padding: 8px 10px; }
.stat b { display: block; font-size: 20px; line-height: 1.2; }
.stat span { font-size: 11.5px; color: var(--muted); }
.menu { list-style: none; padding: 0; margin: 0 0 6px; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.menu li + li { border-top: 1px solid var(--line); }
.menu button { width: 100%; border: 0; background: var(--surface); text-align: left; padding: 12px; display: flex; gap: 10px; align-items: center; }
.menu button span { flex: 1; }
.menu button small { display: block; color: var(--muted); font-size: 11.5px; }

/* ===== 植生：階層・出現種 ===== */
.layertbl { width: 100%; border-collapse: collapse; margin-bottom: 8px; table-layout: fixed; }
.layertbl col.c1 { width: 62px; } .layertbl col.c2, .layertbl col.c3 { width: 66px; }
.layertbl th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: left; padding: 2px 4px; }
.layertbl td { padding: 3px 3px; }
.layertbl td:first-child { font-weight: 700; font-size: 13px; white-space: nowrap; padding-left: 0; }
.layertbl .inp { padding: 8px 7px; font-size: 15px; }
.spadd { background: var(--surface-2); border-radius: var(--r-md); padding: 10px; margin-bottom: 12px; }
.spadd .seg button { min-height: 34px; padding: 5px 10px; }
.spadd .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.spadd .row > span { font-size: 12px; color: var(--muted); width: 34px; flex: none; }
.splist { list-style: none; margin: 0; padding: 0; }
.splist .lyr { font-size: 12px; font-weight: 700; color: var(--k-veg); padding: 8px 0 2px; border-bottom: 1px solid var(--line); }
.splist li.sp { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.splist li.sp .nm { flex: 1; min-width: 0; font-weight: 600; }
.splist li.sp .bb { font-variant-numeric: tabular-nums; font-weight: 700; background: var(--surface-2); border: 0; border-radius: 6px; padding: 4px 9px; }
.splist li.sp.miss { background: #fdecec; }
.splist li.sp .bb.miss { background: #e53935; color: #fff; }
.missbadge { display: inline-block; background: #e53935; color: #fff; border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
.dom.num { text-align: center; font-variant-numeric: tabular-nums; }
.dom.num:empty::before { content: "—"; }

/* ===== 写真 ===== */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos figcaption { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.photos .addph { aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: var(--r-sm); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 12px; }

.photos .skbadge { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; color: var(--k-veg); }
.photos .skbadge svg.ic { width: 15px; height: 15px; }
.photos figure.isk img { object-fit: contain; background: #fff; }
button.addph { font: inherit; cursor: pointer; }

/* ===== スケッチ（断面図） ===== */
.sk { position: fixed; inset: 0; z-index: 98; background: var(--bg); display: flex; flex-direction: column; padding-top: var(--safe-t); padding-bottom: var(--safe-b); }
.sk-top { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sk-top .inp { flex: 1; min-width: 0; padding: 8px 10px; font-size: 15px; }
.sk-tools, .sk-pal { display: flex; gap: 5px; overflow-x: auto; padding: 6px 8px; border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
.sk-tools button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 5px 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; min-height: 36px; }
.sk-tools button svg.ic { width: 17px; height: 17px; }
.sk-tools button.on { background: var(--k-veg); border-color: var(--k-veg); color: #fff; }
.sk-pen { display: inline-flex; gap: 5px; align-items: center; padding-left: 4px; border-left: 1px solid var(--line); }
.sk-pen [data-color] { width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.sk-pen [data-color].on { box-shadow: 0 0 0 3px var(--k-veg); }
.sk-pal { background: var(--surface-2); }
.sk-pal button { flex: none; width: 64px; border: 1.5px solid var(--line); background: #fff; border-radius: var(--r-sm); padding: 2px 2px 3px; display: flex; flex-direction: column; align-items: center; font-size: 10.5px; line-height: 1.2; color: #17241b; }
.sk-pal button img { width: 44px; height: 44px; object-fit: contain; object-position: bottom; }
.sk-pal .sk-sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
.sk-pal button.on { border-color: var(--k-veg); box-shadow: 0 0 0 2px var(--k-veg); }
.sk-hint { font-size: 12px; color: var(--muted); padding: 4px 10px; min-height: 22px; }
.sk-stage { flex: 1; min-height: 0; overflow: auto; background: #dfe5df; padding: 4px; -webkit-overflow-scrolling: touch; }
.sk-stage canvas { display: block; background: #fff; touch-action: none; box-shadow: var(--shadow-1); }
.sk-stage.pan canvas { touch-action: pan-x pan-y pinch-zoom; }
.sk-prop { border-top: 2px solid var(--k-veg); background: var(--surface); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.sk-prow { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.sk-prow label { flex: 1; min-width: 140px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.sk-prow label.sm { flex: 0 0 110px; min-width: 0; }
.sk-prow .inp { padding: 8px 9px; font-size: 15px; }
.sk-prow .btn { flex: 1; }
.sk-prow .seg button { min-height: 32px; padding: 3px 12px; }
@media (orientation: landscape) and (max-height: 500px) { .sk-pal button { width: 54px; } .sk-pal button img { width: 34px; height: 34px; } .sk-hint { display: none; } }

/* ===== 地図の文字 ===== */
.treelabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.treelabels span { position: absolute; white-space: nowrap; font-weight: 700; color: #102116; background: rgba(255,255,255,.82); border-radius: 4px; padding: 0 3px; line-height: 1.3; }
.treelabels span.sel { background: #fff59d; }
.treelabels span.plot { background: #efe6fb; color: #3d2366; }

/* ===== 表示設定 ===== */
.popover { position: fixed; z-index: 25; right: 68px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); width: min(310px, calc(100vw - 84px)); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-2); padding: 12px 14px; }
.popover h3 { margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
.popover .seg { margin-bottom: 10px; }
.popover .seg button { min-height: 34px; padding: 5px 11px; font-size: 13px; }

/* ===== 位置合わせ ===== */
.addbar { position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(var(--nav-h) + var(--safe-b) + 12px); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-2); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 560px; margin: 0 auto; }
.addbar > span { flex: 1 1 100%; font-size: 13px; }
.addbar .btn { flex: 1; }
.crosshair { position: fixed; z-index: 12; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; color: #d32f2f; pointer-events: none; filter: drop-shadow(0 0 2px #fff); }
body.adding .toast { bottom: calc(var(--nav-h) + var(--safe-b) + 150px); }
body.adding .fabs, body.adding .legend, body.adding .sheet { display: none; }

/* ===== ダイアログ・通知 ===== */
.modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(10,20,14,.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-2); width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 18px 18px 14px; }
.modal h3 { margin: 0 0 8px; font-size: 17px; }
.modal p { margin: 6px 0; }
.modal .btnrow { margin-top: 14px; }
.modal ul { padding-left: 18px; margin: 6px 0; }
.toast { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 84px); background: #1d2a21; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; box-shadow: var(--shadow-2); max-width: calc(100vw - 32px); text-align: center; }
.pbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 10px 0 4px; }
.pbar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.viewer { position: fixed; inset: 0; z-index: 110; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
.viewer .vbar { display: flex; gap: 8px; padding: 10px; padding-bottom: calc(10px + var(--safe-b)); background: #111; }
.viewer .vbar .inp { background: #222; color: #fff; border-color: #333; }

/* ===== 起動画面 ===== */
.start { position: fixed; inset: 0; z-index: 90; background: var(--green-800); color: #fff; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: calc(var(--safe-t) + 36px) 20px calc(var(--safe-b) + 24px); }
.start .logo { width: 72px; height: 72px; }
.start h1 { font-size: 24px; margin: 12px 0 2px; letter-spacing: .04em; }
.start .sub { margin: 0 0 22px; opacity: .8; font-size: 13px; text-align: center; }
.startbox { width: min(400px, 100%); background: var(--surface); color: var(--fg); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-2); }
.startbox .btn.main { width: 100%; margin-top: 6px; min-height: 50px; font-size: 16px; }
.start .ver { margin-top: 18px; font-size: 12px; opacity: .7; }
.start .prep { width: min(400px, 100%); margin-top: 12px; font-size: 12.5px; background: rgba(255,255,255,.12); border-radius: var(--r-md); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.start .prep svg.ic { width: 18px; height: 18px; }
.start .err { color: #ffd2d2; }
</style>
</head>
<body>
<div id="map" aria-label="調査地の地図"></div>

<header class="topbar">
  <div class="searchbar">
    <i data-ic="search"></i>
    <input id="q" type="search" enterkeyhint="search" placeholder="樹木番号・樹種・調査区番号で検索" autocomplete="off" aria-label="検索">
    <button id="qClear" class="icon-btn" aria-label="検索語を消す" hidden><i data-ic="x"></i></button>

  </div>
  <div class="headchips">
    <button id="chipWho" aria-label="調査員を変更"><i data-ic="user"></i><span></span></button>
    <button id="chipSite" aria-label="調査地を変更"><i data-ic="pin"></i><span></span></button>
    <button id="chipProg" class="prog" aria-label="地上部調査の進み具合"><span></span></button>
  </div>
</header>
<div id="offPill" class="offpill" hidden><i data-ic="warn"></i>オフライン</div>
<div id="legend" class="legend" hidden></div>

<div class="fabs">
  <button id="layerBtn" class="fab" aria-label="地図の表示設定"><i data-ic="layers"></i></button>
  <button id="nextBtn" class="fab" aria-label="次の未調査の木へ"><i data-ic="next"></i></button>
  <button id="addVegBtn" class="fab veg" aria-label="植生調査区を追加"><i data-ic="plus"></i><small>植生</small></button>
  <button id="addTreeBtn" class="fab add" aria-label="樹木を追加"><i data-ic="plus"></i><small>樹木</small></button>

</div>

<div id="layerPop" class="popover" hidden>
  <h3>背景地図</h3>
  <div class="seg" id="bmSeg"><button data-bm="photo">航空写真</button><button data-bm="pale">淡色</button><button data-bm="std">標準</button><button data-bm="osm">OSM</button></div>
  <h3>点の色分け</h3>
  <div class="seg" id="cmSeg"><button data-cm="status">調査状況</button><button data-cm="growth">生育状況</button><button data-cm="forest">樹林の種類</button></div>
  <h3>地図の文字（樹木番号_樹種）</h3>
  <div class="seg" id="lbSeg"><button data-lb="on">表示する</button><button data-lb="off">表示しない</button></div>
</div>

<nav class="bottomnav" aria-label="調査メニュー">
  <button data-pane="gaikyo"><i data-ic="clip"></i>概況調査</button>
  <button data-pane="chijo"><i data-ic="tree"></i>地上部調査</button>

</nav>

<section id="sheet" class="sheet" hidden aria-live="polite">

    <button id="sheetClose" class="icon-btn" aria-label="閉じる"><i data-ic="x"></i></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<datalist id="spList"></datalist>
<datalist id="siteList"></datalist>
<datalist id="byList"></datalist>

<div id="placeBar" class="addbar" hidden><span id="placeMsg"></span><button class="btn line" id="placeHere">現在地</button><button class="btn line" id="placeCancel">やめる</button><button class="btn main" id="placeOk">この位置にする</button></div>
<svg id="crosshair" class="crosshair" viewBox="0 0 44 44" hidden aria-hidden="true"><circle cx="22" cy="22" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="fileIn" hidden>

<div id="start" class="start">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2f8052"/><circle cx="25" cy="25" r="12" fill="#8fd19e"/><rect x="23" y="33" width="4" height="17" rx="2" fill="#f3efe4"/><path d="M38 50c0-8 3-14 8-18M44 50c0-6 2-10 6-13M41 50c-1-5-4-9-8-11" stroke="#d9c7f5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <h1 id="appTitle">津波防災調査アプリ</h1>
  <p class="sub">地上部調査・概況調査・植生調査</p>
  <div class="startbox">
    <label class="field"><span class="lbl">調査員の名前</span><input id="stName" class="inp" list="byList" autocomplete="off" placeholder="例：山田 太郎"></label>
    <label class="field"><span class="lbl">調査地</span><select id="stSite" class="inp"></select></label>
    <p id="stErr" class="help" style="color:var(--danger)" hidden></p>
    <button id="stGo" class="btn main" disabled>読み込み中…</button>
  </div>
  <div id="prep" class="prep" hidden></div>
  <p class="ver" id="appVer"></p>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
 * 設定：調査の様式に合わせて変更できます
 *   項目の type：buttons=ボタン選択 / scale=評価（1〜4、説明つき）/ multi=複数選択 / select=プルダウン
 *               number=数値 / nums=数値（横並び） / line=1行の文字 / text=文章
 *   required：完了時に必須 / forest：その樹林の種類（広葉樹・針葉樹）の木だけに表示
 *   onlyIf：{項目id:[値…]} のいずれかの値のときだけ表示 / exclusive：他と同時に選べない選択肢
 *   ※ 地上部調査・概況調査の項目は仮の内容です。様式（Excel）に合わせて items を差し替えてください。
 * ===================================================================== */
window.APP_CONFIG = {
  version: "1.9.3（2026-11-11）",   // 更新したら sw.js の VERSION も変える
  appTitle: "津波防災調査アプリ",
  filePrefix: "津波防災調査",
  storageKey: "chijo-veg",           // 端末内の保存名（同じURLで別の業務を分けるときに変更）
  dbName: "chijo-veg-survey",
  center: [139.6949, 35.6716],
  zoom: 15,
  basemap: "photo",                  // pale（淡色）／std（標準）／photo（航空写真）／osm
  offline: { maxTiles: 6000, minZoom: 10 },
  maxPhotos: 12,
  // スケッチ（断面図）：アイコンの標準の高さ（m）と、方眼の初期の範囲（m）
  sketch: { sizes: { tree: { L: 12, M: 6, S: 2.5 }, herb: { L: 1.5, M: 0.8, S: 0.4 }, vine: { L: 6, M: 4, S: 2 } }, widthM: 20, heightM: 15 },
  photoMaxPx: 1600,

  // 樹木データの選択肢
  forestTypes: ["広葉樹", "針葉樹"],
  growthTypes: ["良好", "不良"],

  // 調査地の候補（調査票の「選択肢」シート）と調査者の候補
  sites: ["埒浜防災緑地", "豊間防災緑地", "四倉防災緑地"],
  surveyors: ["藤原", "畑川", "藤原・畑川"],
  // 活力度＝各項目の評価値の合計÷評価項目数（小数1位に四捨五入）。上限値「未満」ならその判定（地上部調査票の M21・M22 と同じ）
  vitality: [[0.8, "良好"], [1.6, "やや不良"], [2.4, "不良"], [3.2, "著しく不良"], [Infinity, "枯死寸前"]],

  surveys: {
    // ===== 地上部調査（1本ごと。様式「地上部調査票」） =====
    chijo: {
      label: "地上部調査", photoCaps: ["全景", "樹冠", "幹", "根元", "葉", "被害部"],
      items: [
        { id: "g", section: "幹周（胸高周囲長）", label: "幹周 1〜5本目（cm）", colPrefix: "幹周", colUnit: "cm", type: "nums", fields: [1, 2, 3, 4, 5].map((k) => ({ id: "g" + k, label: k + "本目", max: 1000 })), help: "株立ちは1本ずつ入力。2本以上のときは Σ×0.7 を計算します（様式と同じ）" },
        { id: "gCalc", type: "calc", calc: "girth" },
        { id: "d", section: "地際直径（根元径）", label: "地際直径 1〜5本目（cm）", colPrefix: "地際直径", colUnit: "cm", type: "nums", fields: [1, 2, 3, 4, 5].map((k) => ({ id: "d" + k, label: k + "本目", max: 500 })) },
        { id: "dCalc", type: "calc", calc: "base" },
        { id: "hw", section: "樹高・枝張り", label: "樹高（m）・枝張り（m）", type: "nums", fields: [{ id: "h", label: "樹高", unit: "m", max: 60 }, { id: "ew", label: "枝張り 東西", unit: "m", max: 60 }, { id: "ns", label: "枝張り 南北", unit: "m", max: 60 }] },
        { id: "wCalc", type: "calc", calc: "spread" },
        { id: "vHead", section: "活力度調査（0 良好 ←→ 4 不良）", label: "評価の方法", type: "note", help: "各項目を0〜4で評価します。ⓘ を押すと評価基準が出ます。落葉の場合は⑤・⑥を空欄にすると、除いて計算します（様式の注記）。" },
        { id: "v1", label: "①樹勢", type: "scale", base: 0, score: true, required: true,
          desc: ["旺盛な生育状態を示し被害が全くみられない", "一部が幾分影響を受けているが、全体としてあまりめだたない", "一部が枯死するなど異常が明らかに認められる", "全体的に生育状態がきわめて劣悪である", "ほとんど枯死又は枯死"] },
        { id: "v2", label: "②樹形", type: "scale", base: 0, score: true, required: true,
          desc: ["自然樹形を保っている", "若干の乱れはあるが、自然樹形に近い", "自然樹形の崩壊がかなり進んでいる", "自然樹形がほぼ崩壊し、奇形化している", "ほとんど完全に崩壊又は枯死"] },
        { id: "v3", label: "③新梢・枝条の枯損", type: "scale", base: 0, score: true, required: true,
          desc: ["枯損はない", "小枝に枯れがある", "新梢や中枝に枯れがある", "著しく枯れている（1/3～1/2枯れ）", "ほとんど枯損している"] },
        { id: "v4", label: "④枝葉の密度", type: "scale", base: 0, score: true, required: true,
          desc: ["枝と密度のバランスがとれている", "0に比べてやや劣る", "やや疎", "枯枝が多く葉の発生が少なく著しく疎", "ほとんど枝葉がない又は枯死"] },
        { id: "v5", label: "⑤葉の大きさ", type: "scale", base: 0, score: true,
          desc: ["葉がすべて十分な大きさ", "所々に小さい葉がある", "全体にやや小さい", "全体に著しく小さい", "わずかな葉しかなく又は枯死、それも小さい"] },
        { id: "v6", label: "⑥葉色（クロマツの場合）", type: "scale", base: 0, score: true,
          desc: ["全体に濃い緑色を保っている（アカヤケがない）", "やや薄いが緑色を保っている（アカヤケが全体の50%未満）", "黄色、赤褐色の葉が目立つ（アカヤケが全体の50%以上）", "大部分が薄い緑色（アカヤケがほぼ100%、頂芽に回復の可能性）", "薄い緑色と黄色、赤褐色のみ又は枯死（アカヤケがほぼ100%、頂芽に回復の可能性低）"] },
        { id: "v7", label: "⑦樹皮の傷（剥皮・壊死）", type: "scale", base: 0, score: true, required: true,
          desc: ["傷などほとんどなし", "穿孔・傷が少しあるが、あまり目立たない", "古傷が残る", "傷からの腐朽が著しい", "大きな空洞、剥がれがある又は枯死"] },
        { id: "vCalc", type: "calc", calc: "vitality" },
        { id: "note", section: "メモ", label: "メモ", type: "text", voice: true, placeholder: "下層植生の有無、リターの堆積状況、その他樹種、病害虫の発生状況など", help: "調査票には出力されません（植生調査・一覧表に出力します）" },
      ],

<script>
/* =====================================================================
 * 端末内の保存（IndexedDB）。記録（recs）・写真（photos）・その他（kv）
 * ===================================================================== */
window.Store = (function () {
  const DB = window.APP_CONFIG.dbName;
  let p = null, mem = null;
  function open() {
    if (p) return p;
    p = new Promise((res) => {
      try {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => { for (const st of ["recs", "photos", "kv"]) if (!r.result.objectStoreNames.contains(st)) r.result.createObjectStore(st, { keyPath: "id" }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => { mem = {}; res(null); };
      } catch { mem = {}; res(null); }
    });
    return p;
  }
  const tx = (db, store, mode, fn) => new Promise((res, rej) => { const t = db.transaction(store, mode), r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  function coll(name) {
    const m = () => (mem[name] = mem[name] || new Map());
    return {
      async all() { const db = await open(); return db ? tx(db, name, "readonly", (s) => s.getAll()) : [...m().values()]; },
      async get(id) { const db = await open(); return db ? tx(db, name, "readonly", (s) => s.get(id)) : m().get(id); },
      async put(x) { const db = await open(); if (!db) { m().set(x.id, x); return x; } await tx(db, name, "readwrite", (s) => s.put(x)); return x; },
      async remove(id) { const db = await open(); if (!db) { m().delete(id); return; } await tx(db, name, "readwrite", (s) => s.delete(id)); },
      async clear() { const db = await open(); if (!db) { m().clear(); return; } await tx(db, name, "readwrite", (s) => s.clear()); },
    };
  }
  const kvc = coll("kv");
  return {
    get persistent() { return !mem; },
    recs: coll("recs"), photos: coll("photos"),
    kv: { async get(k, d = null) { const x = await kvc.get(k); return x ? x.v : d; }, put: (k, v) => kvc.put({ id: k, v }), all: () => kvc.all(), clear: () => kvc.clear() },
  };
})();

(function () {
  "use strict";
  const CFG = window.APP_CONFIG, SV = CFG.surveys, VEG = SV.veg;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const fmt = (n) => (+n || 0).toLocaleString("ja-JP");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toKata = (s) => String(s ?? "").replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad2 = (n) => String(n).padStart(2, "0");
  const today = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const dateJ = (s) => s ? String(s).replace(/^(\d+)-(\d+)-(\d+)$/, (_, y, m, d) => `${y}年${+m}月${+d}日`) : "";
  const stamp = (d = new Date()) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  const isWide = () => matchMedia("(min-width: 900px)").matches;
  const distM = (lon1, lat1, lon2, lat2) => { const R = 6371000, r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r; const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); };
  const LSP = CFG.storageKey + "-";
  const ls = { get: (k, d) => { try { const v = localStorage.getItem(LSP + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(LSP + k, JSON.stringify(v)); } catch { } } };

  // ---------- アイコン ----------

    layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',

    plus: '<path d="M12 5v14M5 12h14"/>',
    expand: '<path d="m6 15 6-6 6 6"/>',
    shrink: '<path d="m6 9 6 6 6-6"/>',
    share: '<path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
    down: '<path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 21h14"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/>',
    tree: '<circle cx="12" cy="9" r="6"/><path d="M12 15v6"/>',
    grass: '<path d="M4 21c0-6 2-10 5-13M10 21c0-5 1-9 3-12M16 21c0-4 1-7 4-9M8 21c-1-3-3-5-5-6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
    mapview: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>',
    check: '<path d="m5 12 5 5 9-10"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>',
    next: '<path d="M5 12h12M13 6l6 6-6 6"/>',
    warn: '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>',
    clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
    file: '<path d="M6 3h8l5 5v13H6Z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    move: '<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13 7 4 4"/>',
    upload: '<path d="M12 16V3M7 8l5-5 5 5"/><path d="M5 21h14"/>',
  };
  const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
  const paintIcons = (root = document) => root.querySelectorAll("i[data-ic]").forEach((el) => { el.outerHTML = ic(el.dataset.ic); });

  // ---------- 通知・ダイアログ ----------
  let toastT;
  function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }
  function dialog({ title, body = "", ok = "OK", cancel = "やめる", danger = false, input = null }) {
    return new Promise((res) => {
      const d = document.createElement("div"); d.className = "modal-wrap";
      d.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${body}
        ${input ? `<input class="inp" id="dlgIn" value="${esc(input.value || "")}" placeholder="${esc(input.placeholder || "")}"${input.list ? ` list="${input.list}"` : ""}>` : ""}
        <div class="btnrow">${cancel ? `<button class="btn line" data-r="0">${esc(cancel)}</button>` : ""}<button class="btn ${danger ? "danger" : "main"}" data-r="1">${esc(ok)}</button></div></div>`;
      document.body.appendChild(d);
      const inp = d.querySelector("#dlgIn"); if (inp) { setTimeout(() => inp.focus(), 50); inp.addEventListener("keydown", (e) => { if (e.key === "Enter") d.querySelector('[data-r="1"]').click(); }); }
      d.addEventListener("click", (e) => {
        const b = e.target.closest("[data-r]"); if (!b && e.target !== d) return;
        const r = b ? b.dataset.r === "1" : false; d.remove();
        res(input ? (r ? inp.value.trim() : null) : r);
      });
    });
  }
  // 複数の入力欄を持つダイアログ（fields：[{id,label,value,options,list,type}]）
  function formDialog({ title, body = "", fields, ok = "OK" }) {
    return new Promise((res) => {
      const d = document.createElement("div"); d.className = "modal-wrap";
      d.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${body}
        ${fields.map((f) => `<label class="field"><span class="lbl">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ""}</span>${f.options
          ? `<div class="seg" data-fid="${f.id}">${f.options.map((o) => `<button type="button" data-v="${esc(o)}"${f.value === o ? ' class="on"' : ""}>${esc(o)}</button>`).join("")}</div>`
          : `<input class="inp" data-fid="${f.id}" value="${esc(f.value ?? "")}"${f.list ? ` list="${f.list}"` : ""}${f.type ? ` type="${f.type}"` : ""} placeholder="${esc(f.placeholder || "")}">`}</label>`).join("")}
        <p class="help" id="fdErr" style="color:var(--danger)" hidden></p>
        <div class="btnrow"><button class="btn line" data-r="0">やめる</button><button class="btn main" data-r="1">${esc(ok)}</button></div></div>`;
      document.body.appendChild(d);
      const vals = Object.fromEntries(fields.map((f) => [f.id, f.value ?? ""]));
      d.addEventListener("click", (e) => {
        const sb = e.target.closest(".seg button");
        if (sb) { const g = sb.parentElement, id = g.dataset.fid, on = !sb.classList.contains("on"); $$("button", g).forEach((b) => b.classList.remove("on")); if (on) sb.classList.add("on"); vals[id] = on ? sb.dataset.v : ""; return; }
        const b = e.target.closest("[data-r]"); if (!b) return;
        if (b.dataset.r === "0") { d.remove(); res(null); return; }
        $$("input[data-fid]", d).forEach((i) => { vals[i.dataset.fid] = i.value.trim(); });
        const miss = fields.filter((f) => f.required && !vals[f.id]).map((f) => f.label);
        if (miss.length) { const er = $("#fdErr", d); er.textContent = `${miss.join("・")}を入力してください`; er.hidden = false; return; }
        d.remove(); res(vals);
      });
    });

      <div class="btnrow" style="margin-bottom:6px"><button class="btn line mini" data-act="editTree">${ic("edit")}樹木情報を直す</button><button class="btn line mini" data-act="moveTree">${ic("move")}位置を直す</button><button class="btn line mini" data-act="flyTree">${ic("mapview")}地図で見る</button><button class="btn danger mini" data-act="delTree">${ic("trash")}この木を削除</button></div>
      ${metaHTML(rec)}
      ${itemsHTML(items, rec.ans, ctx)}
      <div class="sec">写真</div><div id="phHost"></div>
      <div class="sticky-foot">${old ? `<button class="btn danger" data-act="delRec">${ic("trash")}</button>` : ""}<button class="btn line" data-act="nextTree">次の木</button><button class="btn main" data-act="doneRec">${old && old.status === "done" ? "完了済み" : "調査完了"}</button></div>`,
      () => { refreshVisibility(); renderPhotos(); });
    if (!isWide() && sheetSize() === "mini") setSheetSize("half");
    flyTo(t.lon, t.lat);
  }

  async function doneRec() {
    const c = S.cur; if (!c) return;
    const miss = missingItems(c);
    if (c.kind === "veg" && !(c.rec.sp || []).length) miss.push("出現種（1種以上）");
    if (!miss.length && c.kind === "veg") { const m = c.rec.sp.filter((x) => !x.c || !x.s).length; if (m && !(await dialog({ title: `被度・群度の未入力が ${m}件 あります`, body: `<p>このまま完了にできます。未入力の出現種は一覧で<b style="color:var(--danger)">赤く</b>表示され、Excelでも赤く塗られます。</p>`, ok: "完了にする", cancel: "入力に戻る" }))) return; }
    if (miss.length) { await dialog({ title: "未入力の項目があります", body: `<ul>${miss.map((m) => `<li>${esc(m)}</li>`).join("")}</ul><p class="small muted">入力すると「完了」にできます（入力内容は下書きとして保存済みです）。</p>`, ok: "閉じる", cancel: null }); return; }
    c.rec.status = "done"; c.rec.doneAt = new Date().toISOString(); await saveCur();
    toast("完了として保存しました");
    if (c.kind === "chijo") { const n = nextTreeIndex(c.i); if (n != null && await dialog({ title: "調査完了", body: `<p>次の未調査の木（${esc(T[n].tno)}_${esc(T[n].sp)}）へ進みますか？</p>`, ok: "次の木へ", cancel: "一覧に戻る" })) openChijo(n); else showChijoList(); }
    else if (c.kind === "gaikyo") showGaikyoList();
    else showVegList();
  }
  async function delRec() {
    const c = S.cur; if (!c || !R.has(c.rec.id)) return;
    if (!(await dialog({ title: "この調査記録を削除しますか？", body: "<p>入力内容と写真が削除されます。元に戻せません。</p>", ok: "削除する", danger: true }))) return;
    for (const p of c.rec.photos || []) await Store.photos.remove(p.id);
    await Store.recs.remove(c.rec.id); R.delete(c.rec.id);
    toast("削除しました"); applyFilter();
    if (c.kind === "chijo") showChijoList(); else if (c.kind === "gaikyo") showGaikyoList(); else showVegList();
  }
  // 次の未調査の木（今の木・現在地・地図の中心から近い順）
  function nextTreeIndex(from) {
    const o = from != null && T[from] ? [T[from].lon, T[from].lat] : S.userLoc || (map ? [map.getCenter().lng, map.getCenter().lat] : null);
    let best = null, bd = Infinity;
    for (let i = 0; i < T.length; i++) { if (i === from || !inSite(T[i].site) || statusOf(treeRec(i)) === "done") continue; const d = o ? distM(o[0], o[1], T[i].lon, T[i].lat) : i; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  async function editTree() {
    const c = S.cur; if (!c || c.kind !== "chijo") return; const t = T[c.i];
    const v = await formDialog({ title: "樹木情報を直す", body: `<p class="small muted">この端末での修正として保存し、出力にも反映します。樹木番号・調査地は変更できません。</p>`,
      fields: [{ id: "sp", label: "樹種", value: t.sp, list: "spList" }, { id: "forest", label: "樹林の種類", value: t.forest, options: CFG.forestTypes }, { id: "growth", label: "生育状況", value: t.growth, options: CFG.growthTypes },
        { id: "kiban", label: "植栽基盤調査", value: t.kiban, options: ["有", "無"] }, { id: "konkei", label: "根系調査", value: t.konkei, options: ["有", "無"] }, { id: "memo", label: "備考", value: t.memo }], ok: "保存" });
    if (!v) return;
    const fixes = await Store.kv.get("fixes", {}); fixes[t.key] = { ...(fixes[t.key] || {}), sp: toKata(v.sp), forest: v.forest, growth: v.growth, kiban: v.kiban, konkei: v.konkei, memo: v.memo, at: new Date().toISOString(), by: S.name };
    await Store.kv.put("fixes", fixes); await loadTrees(); applyFilter(); openChijo(c.i); toast("樹木情報を保存しました");
  }

  // =====================================================================
  // 概況調査（調査地ごと）
  // =====================================================================
  function siteSummary(site) {
    const ts = T.filter((t) => t.site === site), n = (f) => ts.filter(f).length;
    return { n: ts.length, br: n((t) => t.forest === "広葉樹"), co: n((t) => t.forest === "針葉樹"), good: n((t) => t.growth === "良好"), bad: n((t) => t.growth === "不良"), done: n((t) => statusOf(R.get(recId.chijo(t.key))) === "done") };
  }
  function showGaikyoList() {
    S.cur = null; S.sel = null; setSelFilter();
    const sites = siteList().sort((a, b) => (b === S.site) - (a === S.site));
    openPane("gaikyo", "概況調査", `<p class="small muted" style="margin-top:0">調査地ごとに1件記録します。</p>
      ${sites.length ? `<ul class="list">${sites.map((s) => { const r = R.get(recId.gaikyo(s)), sm = siteSummary(s);
        return `<li><button data-act="openGaikyo" data-site="${esc(s)}"><span class="dotc" style="background:${r ? (r.status === "done" ? "#8a5a1f" : "#fff") : "#8a968e"}"></span><span class="main"><span class="t1">${esc(s)}${s === S.site ? '<span class="badge" style="margin-left:6px">選択中</span>' : ""}</span><span class="t2">${esc(activeZones(s, r ? r.ans : {}).map((z) => zoneName(r ? r.ans : {}, z)).join("・"))}${r && r.date ? `・${dateJ(r.date)}` : ""}</span></span>${statusBadge(statusOf(r))}</button></li>`; }).join("")}</ul>` : `<p class="empty">調査地がありません。</p>`}
      <button class="btn line block" data-act="addSite" style="margin-top:12px">${ic("plus")}調査地を追加</button>`);
  }
  // 調査区（列）ごとの項目。id は「調査区|項目」
  const GK = SV.gaikyo;
  const zoneItems = (z) => [
    { id: `${z}|name`, label: "調査区名（現地に合わせて変更可）", type: "line", placeholder: GK.zones.find((x) => x[0] === z)[1] },
    ...GK.rows.map((r) => ({ ...r, id: `${z}|${r.id}`, zone: z })),
    ...(GK.spacing || []).map((r) => ({ ...r, id: `${z}|${r.id}`, zone: z, fields: r.fields && r.fields.map((f) => ({ ...f, id: `${z}|${f.id}` })) })),
  ];
  // 様式の行ごとの定義（管理状況は選択肢1つが1行）。get(ans, 調査区) で調査票に書く値
  const zoneHasData = (a, z) => GK.rows.some((r) => filled(a[`${z}|${r.id}`]));
  const gRowDefs = () => GK.rows.flatMap((r) => r.rows ? r.options.map((o, k) => ({ row: r.rows[k], label: o, section: r.section, item: r,
    get: (a, z) => (a[`${z}|${r.id}`] || []).includes(o) ? "●" : zoneHasData(a, z) ? "×" : "" }))
    : r.row ? [{ row: r.row, label: r.label, section: r.section, item: r, get: (a, z) => { const v = a[`${z}|${r.id}`]; return r.type === "number" ? nv(v) ?? "" : ansText(v); } }] : []);
  const noteItems = () => { let sec = ""; return [{ id: "otherName", section: "「その他」の内容", label: "3 管理状況「その他（ ）」に入れる内容", type: "line" },
    ...gRowDefs().map((d, k) => { if (d.section) sec = d.section; return { id: "note|" + d.row, section: k === 0 ? "備考（行ごと）" : undefined, label: `${sec}：${d.label}`, type: "line" }; })]; };
  const zoneName = (ans, z) => ans[`${z}|name`] || GK.zones.find((x) => x[0] === z)[1];
  const zoneShort = (ans, z) => ans[`${z}|name`] || GK.zones.find((x) => x[0] === z)[2] || zoneName(ans, z);
  // その調査地で調査する調査区：設定（siteZones）で決まっている調査地は固定。それ以外は画面で選んだもの（初期は4つすべて）
  const zonesFixed = (site) => !!(GK.siteZones || {})[site];
  function activeZones(site, ans = {}) {
    const all = GK.zones.map((x) => x[0]);
    if (zonesFixed(site)) return all.filter((z) => GK.siteZones[site].includes(z));
    if (Array.isArray(ans.zones) && ans.zones.length) return all.filter((z) => ans.zones.includes(z));
    return all;
  }
  function openGaikyo(site) {
    const id = recId.gaikyo(site), old = R.get(id), sm = siteSummary(site);
    const rec = old ? JSON.parse(JSON.stringify(old)) : { id, kind: "gaikyo", site, status: "", ans: {}, photos: [], date: today(), by: S.name, lat: null, lon: null };
    const items = [...GK.head, ...GK.zones.flatMap(([z]) => zoneItems(z)), ...noteItems()];
    S.cur = { kind: "gaikyo", rec, items, ctx: {} };
    S.gZone = S.gZone || GK.zones[0][0];
    openPane("gaikyoForm", `概況調査：${site}`, `
      <dl class="infobox"><dt>調査地</dt><dd>${esc(site)}</dd>
        <dt>位置</dt><dd id="gPos">${rec.lat != null ? `${(+rec.lat).toFixed(6)}, ${(+rec.lon).toFixed(6)}` : "未記録"}</dd><dt>状態</dt><dd><span id="curBadge">${statusBadge(statusOf(old))}</span></dd></dl>
      <div class="btnrow" style="margin-bottom:6px"><button class="btn line mini" data-act="posHere">${ic("locate")}現在地を記録</button>${sm.n ? `<button class="btn line mini" data-act="fitSite" data-site="${esc(site)}">${ic("mapview")}地図で見る</button>` : ""}</div>
      ${metaHTML(rec)}${itemsHTML(GK.head, rec.ans, {})}
      <div class="sec">調査区ごとの記入</div>
      ${zonesFixed(site) ? "" : `<div class="field"><span class="lbl">この調査地の調査区（タッチで切り替え）</span><div class="seg" id="gzSel"></div></div>`}
      <div class="ztabs" id="gzTabs" role="tablist"></div>
      <div id="gzBody"></div>
      <div class="sec">写真</div><div id="phHost"></div>
      <div class="sticky-foot">${old ? `<button class="btn danger" data-act="delRec">${ic("trash")}</button>` : ""}<button class="btn line" data-act="backList">一覧へ</button><button class="btn main" data-act="doneRec">${old && old.status === "done" ? "完了済み" : "調査完了"}</button></div>`,
      () => { renderGZone(); renderPhotos(); });
  }
  function renderGZone() {
    const c = S.cur; if (!c || c.kind !== "gaikyo") return;
    const a = c.rec.ans, act = activeZones(c.rec.site, a);
    if (S.gZone !== "note" && !act.includes(S.gZone)) S.gZone = act[0];
    const z = S.gZone;
    if ($("#gzSel")) $("#gzSel").innerHTML = GK.zones.map(([k]) => `<button type="button" data-act="gZoneSel" data-z="${k}"${act.includes(k) ? ' class="on"' : ""}>${esc(zoneName(a, k))}</button>`).join("");
    $("#gzTabs").innerHTML = act.map((k) => `<button role="tab" data-act="gZone" data-z="${k}"${z === k ? ' class="on" aria-selected="true"' : ""}>${esc(zoneShort(a, k))}</button>`).join("") + `<button role="tab" data-act="gZone" data-z="note"${z === "note" ? ' class="on" aria-selected="true"' : ""}>備考</button>`;
    const its = z === "note" ? noteItems() : zoneItems(z);
    $("#gzBody").innerHTML = (z !== "note" ? `<div class="ztitle">${esc(zoneName(a, z))}</div><div class="btnrow" style="margin-bottom:8px"><button class="btn line mini" data-act="gCopy">${ic("file")}ほかの調査区から写す</button></div>` : `<div class="ztitle">備考</div>`) + itemsHTML(its, a, {});
    paintIcons($("#gzBody")); refreshVisibility();
  }
  async function gZoneSel(z) {
    const c = S.cur, a = c.rec.ans, act = activeZones(c.rec.site, a);
    const next = act.includes(z) ? act.filter((x) => x !== z) : GK.zones.map((x) => x[0]).filter((x) => act.includes(x) || x === z);
    if (!next.length) { toast("調査区は1つ以上選んでください"); return; }
    if (act.includes(z) && zoneHasData(a, z) && !(await dialog({ title: `${zoneName(a, z)}を外しますか？`, body: "<p>入力済みの内容は残りますが、画面と出力には表示されなくなります。</p>", ok: "外す" }))) return;
    a.zones = next; await saveCur(); renderGZone();
  }
  async function gCopy() {
    const c = S.cur, a = c.rec.ans, z = S.gZone;
    const act = activeZones(c.rec.site, a), from = GK.zones.filter(([k]) => k !== z && act.includes(k) && GK.rows.some((r) => filled(a[`${k}|${r.id}`])));
    if (!from.length) { toast("写せる調査区がありません（ほかの調査区が未入力）"); return; }
    const v = await formDialog({ title: `${zoneName(a, z)} に写す`, body: `<p class="small muted">選んだ調査区の入力内容を写します（この調査区の入力済みの項目は上書きします）。</p>`, fields: [{ id: "z", label: "写す元", options: from.map((x) => zoneName(a, x[0])), required: true }], ok: "写す" });
    if (!v) return;
    const src = from.find((x) => zoneName(a, x[0]) === v.z)[0];
    for (const r of GK.rows) { const val = a[`${src}|${r.id}`]; if (filled(val)) a[`${z}|${r.id}`] = Array.isArray(val) ? val.slice() : val; }
    await saveCur(); renderGZone(); toast("写しました");
  }
  async function addSite() {
    const s = await dialog({ title: "調査地を追加", body: `<p class="small muted">樹木データにない調査地（植生調査だけ行う場所など）を追加します。</p>`, input: { placeholder: "調査地の名前" }, ok: "追加" });
    if (!s) return;
    const a = ls.get("sites", []); if (!a.includes(s)) { a.push(s); ls.set("sites", a); }
    fillSiteLists(); return s;
  }
  function getPosition() {
    return new Promise((res) => {
      if (!("geolocation" in navigator)) { toast("この端末では位置情報を使えません"); res(null); return; }
      toast("現在地を取得しています…", 8000);
      navigator.geolocation.getCurrentPosition((p) => { $("#toast").hidden = true; S.userLoc = [p.coords.longitude, p.coords.latitude]; res({ lon: p.coords.longitude, lat: p.coords.latitude, acc: p.coords.accuracy }); },
        (e) => { toast(e.code === 1 ? "位置情報の利用が許可されていません。端末の設定で許可してください" : "現在地を取得できませんでした", 4000); res(null); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
    });
  }
  async function setCurPos(p) {
    const c = S.cur; if (!c || !p) return;
    c.rec.lat = +p.lat.toFixed(7); c.rec.lon = +p.lon.toFixed(7); if (p.acc) c.rec.acc = Math.round(p.acc);

    await saveCur(); toast("位置を記録しました");
  }

  // =====================================================================
  // 植生調査（調査区ごと）
  // =====================================================================
  const LAYER_JP = Object.fromEntries(VEG.layers);
  const LAYER_ORDER = VEG.layers.map((l) => l[0]);
  const bb = (s) => `${s.c || "？"}・${s.s || "？"}`;
  function nextPlotNo() {
    let mx = 0; for (const r of vegRecs()) { const m = String(r.no).match(/(\d+)\s*$/); if (m) mx = Math.max(mx, +m[1]); }
    return "R" + String(mx + 1).padStart(3, "0");
  }
  function showVegList() {
    S.cur = null; S.sel = null; setSelFilter();
    const rs = vegRecs().filter((r) => inSite(r.site));
    openPane("veg", `植生調査${S.site ? "：" + S.site : ""}`, `
      <div class="stat"><div><b>${rs.length}</b><span>調査区</span></div><div><b>${rs.filter((r) => r.status === "done").length}</b><span>完了</span></div><div><b>${new Set(rs.flatMap((r) => (r.sp || []).map((s) => s.n))).size}</b><span>出現種（合計）</span></div></div>
      ${rs.length ? `<ul class="list">${rs.map((r) => `<li><button data-act="openVeg" data-id="${esc(r.id)}"><span class="dotc" style="background:${r.status === "done" ? "#7e57c2" : "#fff"};border-color:#4a2b7a"></span><span class="main"><span class="t1">${esc(r.no)}${r.ans.cname ? `　${esc(r.ans.cname)}` : ""}</span><span class="t2">${esc(r.site || "調査地なし")}${r.ans.forest || r.ans.growth ? `・${esc([r.ans.forest, r.ans.growth].filter(Boolean).join("・"))}` : ""}・${dateJ(r.date)}・出現種 ${new Set((r.sp || []).map((s) => s.n)).size}種${r.lat == null ? "・位置未記録" : ""}</span></span>${statusBadge(statusOf(r))}</button></li>`).join("")}</ul>`
        : `<div class="empty">${ic("grass")}<p>植生調査区はまだありません。</p></div>`}
      <div class="btnrow" style="margin-top:12px"><button class="btn main" data-act="newVegHere">${ic("locate")}現在地に調査区を作る</button><button class="btn line" data-act="newVegMap">${ic("pin")}地図で位置を指定</button></div>`);
  }
  async function newVeg(pos) {
    let site = S.site;
    const v = await formDialog({ title: "植生調査区を作る", fields: [{ id: "no", label: "調査区番号", value: nextPlotNo(), required: true }, { id: "site", label: "調査地", value: site, list: "siteList" }], ok: "作る" });
    if (!v) return;
    if (vegRecs().some((r) => r.no === v.no)) { toast(`調査区番号「${v.no}」はすでにあります`, 3500); return; }
    const rec = { id: "v:" + uid(), kind: "veg", no: v.no, site: v.site, status: "draft", ans: { spot: v.site || "" }, layers: {}, sp: [], photos: [], date: today(), by: S.name, lat: pos ? +pos.lat.toFixed(7) : null, lon: pos ? +pos.lon.toFixed(7) : null, acc: pos && pos.acc ? Math.round(pos.acc) : undefined };
    if (v.site && !siteList().includes(v.site)) { const a = ls.get("sites", []); a.push(v.site); ls.set("sites", a); fillSiteLists(); }
    S.cur = { kind: "veg", rec, items: VEG.items, ctx: {} }; await saveCur("quiet"); applyFilter();

  }
  function openVeg(id) {

    if (!rec.ans.spot && rec.site) rec.ans.spot = rec.site;

    openPane("vegForm", `植生調査：${rec.no}`, `
      <dl class="infobox"><dt>調査区番号</dt><dd>${esc(rec.no)} <button class="btn line mini" data-act="renamePlot" style="min-height:26px;padding:1px 8px;margin-left:4px">変更</button></dd><dt>調査地</dt><dd>${esc(rec.site || "—")}</dd>
        <dt>位置</dt><dd id="vPos">${rec.lat != null ? `${(+rec.lat).toFixed(6)}, ${(+rec.lon).toFixed(6)}${rec.acc ? `（誤差 約${rec.acc}m）` : ""}` : "未記録"}</dd><dt>状態</dt><dd><span id="curBadge">${statusBadge(statusOf(old))}</span></dd></dl>
      <div class="btnrow" style="margin-bottom:6px"><button class="btn line mini" data-act="posHere">${ic("locate")}現在地を記録</button><button class="btn line mini" data-act="movePlot">${ic("move")}地図で位置を直す</button></div>
      ${metaHTML(rec)}${itemsHTML(VEG.items, rec.ans, {})}
      <div class="sec">階層構造</div>
      <table class="layertbl"><colgroup><col class="c1"><col class="c2"><col class="c3"><col></colgroup><thead><tr><th>階層</th><th>高さ(m)</th><th>植被率%</th><th>優占種（自動）</th></tr></thead><tbody>
        ${VEG.layers.map(([k, n]) => { const L = rec.layers[k] || {}; return `<tr><td>${esc(n)}</td><td><input class="inp" inputmode="decimal" data-layer="${k}.h" value="${esc(L.h ?? "")}"></td><td><input class="inp" inputmode="decimal" data-layer="${k}.c" value="${esc(L.c ?? "")}"></td><td><span class="dom" data-dom="${k}">${esc(L.d ?? "")}</span></td></tr>`; }).join("")}
      </tbody></table>

    if (rec.lat != null) flyTo(rec.lon, rec.lat);
  }
  // 優占種：階層ごとに被度が最も大きい種（同じなら群度が大きい種。それも同じなら並べて表示）
  const COVER_RANK = (c) => VEG.cover.indexOf(c);
  function updateDominants(rec) {
    let changed = false; rec.layers = rec.layers || {};
    for (const [l] of VEG.layers) {
      const sp = (rec.sp || []).filter((s) => s.l === l); let d = "";
      if (sp.length) { const best = Math.max(...sp.map((s) => COVER_RANK(s.c) * 10 + (+s.s || 0))); d = sp.filter((s) => COVER_RANK(s.c) * 10 + (+s.s || 0) === best).map((s) => s.n).join("・"); }
      if (((rec.layers[l] || {}).d || "") !== d) { (rec.layers[l] = rec.layers[l] || {}).d = d; changed = true; }
    }
    return changed;
  }
  // 被度・群度の説明図（方形区の中の植物の広がりを緑で表す）
  function rng(seed) { let x = seed * 9301 + 49297; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
  // 不定形のかたまり（植物の生えている範囲）
  function blobPts(R, cx, cy, r) { const n = 10, p = []; for (let k = 0; k < n; k++) { const a = Math.PI * 2 * k / n, rr = r * (0.72 + R() * 0.5); p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * (0.8 + R() * 0.3)]); } return p; }
  function blobPath(p) { const m = (i) => [(p[i][0] + p[(i + 1) % p.length][0]) / 2, (p[i][1] + p[(i + 1) % p.length][1]) / 2]; let d = `M${m(p.length - 1)[0].toFixed(1)},${m(p.length - 1)[1].toFixed(1)}`; p.forEach((q, i) => { const e = m(i); d += `Q${q[0].toFixed(1)},${q[1].toFixed(1)} ${e[0].toFixed(1)},${e[1].toFixed(1)}`; }); return d + "Z"; }
  const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; return c; };
  const tick = (x, y) => `<path d="M${(x - 1.6).toFixed(1)},${(y - 2.6).toFixed(1)}v5.2M${(x + 1.6).toFixed(1)},${(y - 2.6).toFixed(1)}v5.2"/>`;
  // 方形区の模式図（緑＝植物の範囲、‖＝個体）
  function bbSvg(kind, v) {
    const R = rng((kind === "c" ? 13 : 41) + "r+12345".indexOf(v) * 17 + 3);
    let fill = "", holes = "", ticks = "", bg = "#f6f1e6";
    const blobs = (target, rmin, rmax, maxN = 60) => {
      const N = 40, g = new Uint8Array(N * N); let cov = 0, k = 0, out = [];
      while (cov / (N * N) < target && k++ < maxN) {
        const r = rmin + R() * (rmax - rmin), p = blobPts(R, r * 0.6 + R() * (100 - r * 1.2), r * 0.6 + R() * (100 - r * 1.2), r); out.push(p);
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!g[i * N + j] && inPoly((i + .5) * 2.5, (j + .5) * 2.5, p)) { g[i * N + j] = 1; cov++; }
      }
      return out;
    };
    const scatter = (n, grid) => { let t = ""; if (grid) { const m = Math.round(Math.sqrt(n)); for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) t += tick(12 + i * 76 / (m - 1) + (R() - .5) * 6, 12 + j * 76 / (m - 1) + (R() - .5) * 6); } else for (let k = 0; k < n; k++) t += tick(8 + R() * 84, 8 + R() * 84); return t; };
    if (kind === "c") {
      if (v === "r") ticks = tick(62, 38);
      else if (v === "+") ticks = scatter(3);
      else if (v === "1") { fill = blobs(0.04, 4, 6, 3).map(blobPath).join(" "); ticks = scatter(12); }
      else { fill = blobs({ "2": 0.16, "3": 0.36, "4": 0.62, "5": 0.86 }[v], 9, v === "2" ? 11 : 20).map(blobPath).join(" "); ticks = scatter(v === "2" ? 10 : 8); }
    } else {
      if (v === "1") ticks = scatter(16, true);
      else if (v === "2") { fill = blobs(0.12, 4, 7, 9).map(blobPath).join(" "); ticks = scatter(6); }
      else if (v === "3") { fill = blobs(0.32, 10, 14, 6).map(blobPath).join(" "); ticks = scatter(4); }
      else if (v === "4") { bg = "#7cc36a"; holes = blobs(0.18, 7, 12, 6).map(blobPath).join(" "); ticks = scatter(9); }
      else { bg = "#7cc36a"; ticks = scatter(16, true); }
    }
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="1" y="1" width="98" height="98" fill="${bg}"/>${fill ? `<path d="${fill}" fill="#2f6b3c" stroke="#2f6b3c" stroke-width="2.6" stroke-linejoin="round"/><path d="${fill}" fill="#7cc36a"/>` : ""}${holes ? `<path d="${holes}" fill="#f6f1e6" stroke="#2f6b3c" stroke-width="1.2"/>` : ""}${kind === "c" ? `<path d="M50 2V98M2 50H98" stroke="#7d8a80" stroke-width="1" stroke-dasharray="4 3"/>` : ""}<g stroke="#1f5a2e" stroke-width="1.3" stroke-linecap="round">${ticks}</g><rect x="1" y="1" width="98" height="98" fill="none" stroke="#3d4a40" stroke-width="2"/></svg>`;
  }
  function bbGuideHTML() {
    const cv = ["5", "4", "3", "2", "1", "+", "r"], sv = ["5", "4", "3", "2", "1"];
    return `<details class="bbguide"><summary>被度・群度の基準（図で確認）</summary>
      <h4>被度（コドラートの面積に対して、その種が覆う割合）</h4>${cv.map((c) => `<div class="bbrow">${bbSvg("c", c)}<p><b>被度 ${esc(c)}</b><span class="bbs">${esc((VEG.coverShort || {})[c] || "")}</span><br>${esc(VEG.coverDesc[c] || "")}</p></div>`).join("")}
      <h4>群度（その種の集まり方）</h4>${sv.map((c) => `<div class="bbrow">${bbSvg("s", c)}<p><b>群度 ${esc(c)}</b><span class="bbs">${esc((VEG.socShort || {})[c] || "")}</span><br>${esc(VEG.socDesc[c] || "")}</p></div>`).join("")}
      <p class="small muted">図の四角はコドラート（方形区）、緑はその種が生えている範囲、‖ は個体を表します。被度の図の点線は面積を4等分する目安です。「ブラウン・ブランケ法」による模式図を参考に作成。</p></details>`;
  }

  // =====================================================================

  const PH_URL = new Map();
  async function photoURL(id) {
    if (PH_URL.has(id)) return PH_URL.get(id);
    const p = await Store.photos.get(id); const u = p ? p.data : ""; if (u) PH_URL.set(id, u); return u;

  async function renderPhotos() {
    const host = $("#phHost"), c = S.cur; if (!host || !c) return;
    const ph = c.rec.photos || [];
    host.innerHTML = `<div class="photos">${ph.map((p, k) => `<figure data-act="viewPh" data-k="${k}"${p.sketch ? ' class="isk"' : ""}><img alt="" data-ph="${p.id}">${p.sketch ? `<span class="skbadge">${ic("edit")}</span>` : ""}<figcaption>${esc(p.cap || "（説明なし）")}</figcaption></figure>`).join("")}

  function shrinkImage(file, max) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {

  async function addPhotos(files) {

  const normHead = (s) => String(s ?? "").toLowerCase().replace(/[\s　（）()［］\[\]・:：]/g, "").replace(/\(?m\)?$|ｍ$/, "");

  // 平面直角座標（JGD2011）→ 緯度経度（国土地理院の計算式）
  const JPR_ORIGIN = [null, [33, 129.5], [33, 131], [36, 132 + 1 / 6], [33, 133.5], [36, 134 + 1 / 3], [36, 136], [36, 137 + 1 / 6], [36, 138.5], [36, 139 + 5 / 6], [40, 140 + 5 / 6], [44, 140.25], [44, 142.25], [44, 144.25], [26, 142], [26, 127.5], [26, 124], [26, 131], [20, 136], [26, 154]];
  function jprToLatLon(X, Y, zone) {
    const o = JPR_ORIGIN[zone]; if (!o) return null;

    const Dl = [0, 2 * n - 2 / 3 * n2 - 2 * n3 + 116 / 45 * n4 + 26 / 45 * n5 - 2854 / 675 * n6, 7 / 3 * n2 - 8 / 5 * n3 - 227 / 45 * n4 + 2704 / 315 * n5 + 2323 / 945 * n6, 56 / 15 * n3 - 136 / 35 * n4 - 1262 / 105 * n5 + 73814 / 2835 * n6, 4279 / 630 * n4 - 332 / 35 * n5 - 399572 / 14175 * n6, 4174 / 315 * n5 - 144838 / 6237 * n6, 601676 / 22275 * n6];
    const p0 = o[0] * rad, l0 = o[1] * rad, k = m0 * a / (1 + n), Ab = k * A[0];

    let lat = chi; for (let j = 1; j <= 6; j++) lat += Dl[j] * Math.sin(2 * j * chi);
    return [lat / rad, (l0 + Math.atan(Math.sinh(eta2) / Math.cos(xi2))) / rad];
  }

  function tileList(b, zmin, zmax, bm) {
    const [w, s, e, n] = b, out = [];
    const tx = (lon, z) => Math.floor((lon + 180) / 360 * 2 ** z), ty = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
    for (let z = zmin; z <= zmax; z++) { const x0 = tx(w, z), x1 = tx(e, z), y0 = ty(n, z), y1 = ty(s, z); if ((x1 - x0 + 1) * (y1 - y0 + 1) > 200000) return null; for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push(tileUrl(bm, z, x, y)); }
    return out;
  }
  const curBounds = () => { const b = map.getBounds(); return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((v) => +v.toFixed(6)); };
  function offlineHTML() {

  }
  async function downloadArea() {
    if (OFF.busy) return;
    if (!navigator.onLine) { toast("地図の保存は通信のある場所で行ってください", 4000); return; }
    if (!("caches" in window)) { toast("このブラウザは地図の保存に対応していません", 4000); return; }
    const bm = OFF.bm, z = OFF.zmax, b = curBounds(), list = tileList(b, CFG.offline.minZoom, z, bm);
    if (!list || list.length > CFG.offline.maxTiles) { toast("範囲が広すぎます。地図を拡大してください", 4000); return; }
    const name = await dialog({ title: "保存する地図の名前", input: { value: `${S.site || "調査地"}付近` }, ok: `保存（約${fmt(list.length)}枚）` });
    if (name == null) return;
    OFF.busy = true;
    const d = document.createElement("div"); d.className = "modal-wrap";
    d.innerHTML = `<div class="modal"><h3>地図を保存しています</h3><div class="pbar"><span id="offBar"></span></div><p class="small" id="offTxt">0 / ${fmt(list.length)}</p><div class="btnrow"><button class="btn line" id="offStop">中止</button></div></div>`;
    document.body.appendChild(d);
    let done = 0, fail = 0, stop = false; $("#offStop", d).onclick = () => { stop = true; };
    const cache = await caches.open("tiles-saved"), q = list.slice();
    const work = async () => { while (q.length && !stop) { const u = q.shift(); try { if (!(await cache.match(u))) { const r = await fetch(u, { mode: "cors" }); if (r.ok) await cache.put(u, r); else fail++; } } catch { fail++; } done++; if (done % 5 === 0 || !q.length) { $("#offBar", d).style.width = (done / list.length * 100).toFixed(1) + "%"; $("#offTxt", d).textContent = `${fmt(done)} / ${fmt(list.length)}${fail ? `（取得できなかった地図 ${fail}枚）` : ""}`; } } };
    await Promise.all(Array.from({ length: 6 }, work));
    d.remove(); OFF.busy = false;
    const areas = offAreas(); areas.unshift({ id: uid(), name: name || "保存した地図", bm, z, b, count: done - fail, date: today() }); ls.set("off-areas", areas);
    persistOnce(); renderMenuIfOpen();
    toast(stop ? "中止しました（保存済みの分は使えます）" : fail ? `${fmt(done - fail)}枚を保存（${fail}枚は取得できませんでした）` : `${fmt(done)}枚の地図を保存しました`, 4000);
  }
  async function deleteArea(id) {
    const areas = offAreas(), a = areas.find((x) => x.id === id); if (!a) return;
    if (!(await dialog({ title: `「${a.name}」を削除しますか？`, ok: "削除する", danger: true }))) return;
    const rest = areas.filter((x) => x.id !== id), keep = new Set();
    for (const r of rest) for (const u of tileList(r.b, CFG.offline.minZoom, r.z, r.bm) || []) keep.add(u);
    try { const c = await caches.open("tiles-saved"); for (const u of tileList(a.b, CFG.offline.minZoom, a.z, a.bm) || []) if (!keep.has(u)) await c.delete(u); } catch { }
    ls.set("off-areas", rest); renderMenuIfOpen(); toast("保存した地図を削除しました");
  }

    const upd = () => { const off = !navigator.onLine; $("#offPill").hidden = !off; };

    const ask = async () => { try { (await navigator.serviceWorker.ready).active?.postMessage("status"); } catch { } };
    const hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      ask(); setTimeout(ask, 4000); setTimeout(ask, 15000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => { }); });
    }).catch(() => { });
    let reloading = false;

      setTimeout(ask, 500); if (!hadCtrl || reloading) return;

    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.dirty && S.cur) saveCur("quiet"); });
  }
  // ホーム画面（起動画面）の表示・非表示。調査地が変わるときに選び直す
  function hideStart() { const st = $("#start"); st.style.transition = "opacity .3s"; st.style.opacity = 0; setTimeout(() => { st.hidden = true; }, 320); }
  async function showStart() {
    if (S.cur && S.dirty) await saveCur("quiet");
    closeSheet(); stopPlace(); $("#layerPop").hidden = true;
    fillSiteLists(); $("#stName").value = S.name || ls.get("name", ""); $("#stSite").value = S.site || ""; $("#stErr").hidden = true;
    const st = $("#start"); st.hidden = false; st.style.transition = "none"; st.style.opacity = 1; st.scrollTop = 0;
  }
  async function ensureDevice() {
    let d = ls.get("device", null) || (await Store.kv.get("device"));
    if (!d) d = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
    ls.set("device", d); await Store.kv.put("device", d); return d;
  }

  (async function main() {
    paintIcons();
    document.title = CFG.appTitle; $("#appTitle").textContent = CFG.appTitle; $("#appVer").textContent = "Ver " + CFG.version;
    S.compactScale = ls.get("compact", false);
    $("#stName").value = ls.get("name", "");
    renderPrep();
    try {
      await ensureMapLib();
      const ready = createMap();
      await loadRecs(); await loadTrees(); S.device = await ensureDevice();
      fillSiteLists();
      await ready;
      addLayers(); initUI(); initSW();
      const go = $("#stGo"); go.disabled = false; go.textContent = "調査を始める";
      $("#stSite").onchange = async (e) => { if (e.target.value === "__new") { const s = await addSite(); fillSiteLists(); e.target.value = s || ""; } };
      go.onclick = () => {
        const n = $("#stName").value.trim(); if (!n) { $("#stErr").textContent = "調査員の名前を入力してください"; $("#stErr").hidden = false; $("#stName").focus(); return; }
        S.name = n; ls.set("name", n); S.site = $("#stSite").value === "__new" ? "" : $("#stSite").value; ls.set("site", S.site);
        applyFilter(); fitSite();
        hideStart();
        if (!Store.persistent) toast("このブラウザでは端末に保存できません（閉じると消えます）", 5000);
        else if (!T.length) setTimeout(() => showChijoList(), 400);
      };
      $("#stName").addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
    } catch (e) {
      console.error(e);
      $("#stErr").textContent = "起動できませんでした：" + e.message; $("#stErr").hidden = false; $("#stGo").textContent = "起動できません";
    }
  })();
})();

</script>
</body>
</html>
